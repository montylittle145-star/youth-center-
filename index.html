<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منظومة مركز شباب طنط الجزيرة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1F5EE;--card:#fff;--ink:#16221C;--mute:#5E6F66;--line:#CBD7CE;--pitch:#0F3D2E;--sig:#F2C230;--bad:#B3261E;--ok:#1E7B4B;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1612;--card:#16221C;--ink:#E8EFE9;--mute:#9DB0A5;--line:#2A3B32;--pitch:#1B5E46;--bad:#FF8A80;--ok:#6FD39B}}
:root[data-theme="dark"]{--bg:#0D1612;--card:#16221C;--ink:#E8EFE9;--mute:#9DB0A5;--line:#2A3B32;--pitch:#1B5E46;--bad:#FF8A80;--ok:#6FD39B}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,sans-serif;line-height:1.6}
header{background:var(--pitch);color:#fff;padding:18px 16px 14px;border-bottom:4px solid var(--sig)}
header h1{margin:0;font-size:22px;font-weight:800}header p{margin:0;font-size:13px;opacity:.8}
main{max-width:820px;margin:0 auto;padding:14px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.st{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.st b{display:block;font-size:24px;font-weight:800}.st span{font-size:12px;color:var(--mute)}
nav{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
nav button{flex:1;white-space:nowrap;font:inherit;font-weight:600;padding:9px 12px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;cursor:pointer}
nav button.on{background:var(--pitch);color:#fff;border-color:var(--pitch)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--sig);outline-offset:1px}
section{display:none}section.on{display:block}
.box{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:12px}
.box h2{margin:0 0 8px;font-size:16px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
label{font-size:12px;color:var(--mute);display:block}
input,select{width:100%;font:inherit;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.go{margin-top:10px;font:inherit;font-weight:800;padding:9px 18px;border:0;border-radius:6px;background:var(--sig);color:#16221C;cursor:pointer}
.sm{font:inherit;font-size:12px;padding:4px 10px;border:1px solid var(--pitch);background:none;color:var(--ink);border-radius:5px;cursor:pointer}
.it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line)}
.it:first-of-type{border-top:0}.it small{color:var(--mute);display:block}
.tag{font-size:12px;font-weight:600;padding:2px 8px;border-radius:10px;border:1px solid currentColor}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:#B07A00}
.msg{min-height:22px;font-size:13px;font-weight:600;margin-top:6px}
.empty{color:var(--mute);font-size:14px;padding:8px 0}
header{display:flex;align-items:center;gap:12px}.lg{width:56px;height:56px;border-radius:50%;background:#fff;object-fit:cover;flex:none}.hd{flex:1}
.av{width:42px;height:42px;border-radius:50%;object-fit:cover;background:var(--line);display:inline-flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.ci{display:flex;gap:10px;align-items:center}.acts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}#q{margin-bottom:8px}#rc{display:none}
@media print{body>*:not(#rc){display:none!important}#rc{display:block!important;padding:24px;color:#000;background:#fff;font-size:16px}#rc img{width:80px}}
</style>
</head>
<body>
<header><img class="lg" alt="شعار"><div class="hd"><h1>مركز شباب طنط الجزيرة</h1><p>محافظة القليوبية — إدارة شباب طوخ</p></div><button class="sm" id="out" style="display:none;color:#fff;border-color:#fff">خروج</button></header>
<div id="login" style="display:none;position:fixed;inset:0;z-index:9;background:var(--bg);padding:24px;padding-top:calc(24px + env(safe-area-inset-top,0px))"><div class="box" style="max-width:360px;margin:8vh auto"><h2>تسجيل دخول الموظفين</h2><label for="le">البريد الإلكتروني</label><input id="le" type="email" autocomplete="username"><label for="lp" style="margin-top:8px">كلمة المرور</label><input id="lp" type="password" autocomplete="current-password"><button class="go" id="lg">دخول</button><div class="msg" id="lm"></div></div></div>
<div id="sync" class="empty" style="padding:6px 16px;font-size:12px;text-align:center"></div>
<main>
<div class="stats" id="stats"></div>
<nav id="nav"><button data-t="m" class="on">الأعضاء</button><button data-t="b">الحجوزات</button><button data-t="p">التحصيل</button></nav>
<section id="m" class="on">
<div class="box"><h2 id="mt">إضافة عضو</h2><div class="row">
<div><label for="mn">الاسم</label><input id="mn"></div>
<div><label for="mp">التليفون</label><input id="mp" inputmode="tel"></div>
<div><label for="mi">الرقم القومي</label><input id="mi" inputmode="numeric" maxlength="14"></div>
<div><label for="mb">تاريخ الميلاد</label><input id="mb" type="date"></div>
<div><label for="mf">الصورة</label><input id="mf" type="file" accept="image/*"></div>
</div><button class="go" id="addm">حفظ العضو</button> <button class="sm" id="cm" style="display:none">إلغاء التعديل</button><div class="msg" id="mm"></div></div>
<div class="box"><h2>الأعضاء</h2><input id="q" placeholder="بحث: اسم / تليفون / رقم قومي / رقم العضو"><div id="ml"></div></div>
</section>
<section id="b">
<div class="box"><h2>حجز جديد</h2><div class="row">
<div><label for="bt">النوع</label><select id="bt"></select></div>
<div id="bfw"><label for="bf">الملعب</label><select id="bf"></select></div>
<div><label for="bd">التاريخ</label><input type="date" id="bd"></div>
<div id="bhw"><label for="bh">من الساعة</label><select id="bh"></select></div>
<div id="bdw"><label for="bu">المدة (ساعات)</label><input id="bu" type="number" min="1" value="1"></div>
<div id="bew"><label><input type="checkbox" id="be" style="width:auto"> أدوات (+5 ج)</label></div>
<div><label for="bn">الاسم</label><input id="bn" list="mnl"><datalist id="mnl"></datalist></div>
<div><label for="bp">السعر (ج)</label><input id="bp" type="number" min="0"></div>
</div><button class="go" id="addb">تأكيد الحجز</button><div class="msg" id="bm"></div></div>
<div class="box"><h2>الحجوزات والاشتراكات</h2><div id="bl"></div></div>
</section>
<section id="p"><div class="box"><h2>آخر عمليات التحصيل</h2><div id="pl"></div></div></section>
</main>
<div id="rc"></div>

const saveLocal=()=>{try{localStorage.setItem('tg2',JSON.stringify(S))}catch(e){}};
async function put(c,id,o){if(db){await db.collection(c).doc(id).set(o)}else{S[c]=S[c].filter(x=>x.id!==id);S[c].push({id,...o});saveLocal();render()}}
async function del(c,id){if(db){await db.collection(c).doc(id).delete()}else{S[c]=S[c].filter(x=>x.id!==id);saveLocal();render()}}
const nx=c=>Math.max(0,...S[c].map(x=>x.no||0))+1;
const pay=(t,w,a)=>put('pays',uid(),{no:nx('pays'),d:today,t,w,a,ts:Date.now(),by:ME});
const say=(el,ok,t)=>{el.className='msg '+(ok?'ok':'bad');el.textContent=t};
async function guard(el,fn){try{await fn()}catch(e){say(el,false,'تعذر الحفظ. تأكد من الصلاحية وحاول مرة أخرى.')}}
const shrink=f=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas');c.width=c.height=120;const x=c.getContext('2d'),s=Math.min(i.width,i.height);x.drawImage(i,(i.width-s)/2,(i.height-s)/2,s,s,0,0,120,120);r(c.toDataURL('image/jpeg',.7))};i.src=fr.result};fr.readAsDataURL(f)});
function status(m){const l=Math.round((new Date(m.end)-new Date(today))/864e5);return l<0?['منتهي','bad']:l<=7?['ينتهي خلال '+l+' يوم','warn']:['ساري','ok']}
const hh=n=>String(n).padStart(2,'0');
function bl(b){return b.end?`${TY[b.t].n} • حتى ${b.end}`:b.t==='f'?`${b.f} • ${b.h}:00 إلى ${b.h+b.u}:00`:b.t==='n'?`${b.f} • ليلية كاملة`:`${TY[b.t].n} • ${b.u} ساعة${b.eq?' + أدوات':''}`}
function render(){
 $('#mnl').innerHTML=S.members.map(m=>`<option value="${esc(m.n)}">`).join('');
 const all=S.members,ac=S.bookings.filter(b=>b.end),act=ac.filter(b=>b.end>=today).length,soon=ac.filter(b=>b.end>=today&&b.end<=add(today,7)).length;
 const tb=S.bookings.filter(b=>b.d===today&&!b.end).length,mon=S.pays.filter(p=>p.d.slice(0,7)===today.slice(0,7)).reduce((s,p)=>s+p.a,0);
 $('#stats').innerHTML=[[act,'مشترك أكاديمية'],[soon,'اشتراك ينتهي خلال أسبوع'],[tb,'حجوزات اليوم'],[mon+' ج','إيراد الشهر']].map(x=>`<div class="st"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('');
 const q=$('#q').value.trim();let ms=[...all].sort((a,b)=>a.n.localeCompare(b.n,'ar'));
 if(q)ms=ms.filter(m=>(m.n+' '+(m.ph||'')+' '+(m.nid||'')).includes(q)||String(m.no)===q.replace('#',''));
 $('#ml').innerHTML=ms.length?ms.map(m=>{const av=m.photo?`<img class="av" src="${m.photo}" alt="">`:`<span class="av">${esc(m.n[0]||'؟')}</span>`;
  return `<div class="it"><div class="ci">${av}<div><b>${esc(m.n)}</b> <small style="display:inline">#${m.no||''}</small><small>${esc(m.ph||'')}${m.nid?' • '+esc(m.nid):''}</small></div></div><div class="acts"><button class="sm" data-e="${m.id}">تعديل</button><button class="sm" data-d="${m.id}">حذف</button></div></div>`}).join(''):'<div class="empty">لا يوجد أعضاء مطابقين.</div>';
 const up=S.bookings.filter(b=>b.end?b.end>=today:b.d>=today).sort((a,b)=>(a.d+hh(a.h)).localeCompare(b.d+hh(b.h)));
 $('#bl').innerHTML=up.length?up.map(b=>`<div class="it"><div><b>${esc(b.n)}</b><small>${b.d} • ${bl(b)}</small></div><div class="acts">${b.end?`<button class="sm" data-k="${b.id}">تجديد</button>`:''}<button class="sm" data-x="${b.id}">إلغاء</button></div></div>`).join(''):'<div class="empty">لا توجد حجوزات قادمة.</div>';
 const ps=[...S.pays].sort((a,b)=>(b.ts||0)-(a.ts||0)).slice(0,40);
 $('#pl').innerHTML=ps.length?ps.map(p=>`<div class="it"><div><b>${esc(p.t)}</b><small>#${p.no||''} • ${esc(p.w)} • ${p.d}</small></div><div class="acts"><b>${p.a} ج</b><button class="sm" data-rc="${p.id}">إيصال</button></div></div>`).join(''):'<div class="empty">لا توجد عمليات تحصيل بعد.</div>';
}
function receipt(id){const p=S.pays.find(x=>x.id===id);if(!p)return;
 $('#rc').innerHTML=`<div style="text-align:center"><img src="${LOGO}" alt=""><h2>مركز شباب طنط الجزيرة</h2><p>إيصال استلام نقدية رقم ${p.no||''}</p></div><hr><p>التاريخ: ${p.d}</p><p>استلمنا من: ${esc(p.w)}</p><p>البند: ${esc(p.t)}</p><p><b>المبلغ: ${p.a} جنيه</b></p><p>المحصّل: ${esc(p.by||'')}</p><br><p>التوقيع: ____________</p>`;window.print()}

$('#addb').onclick=()=>{const t=$('#bt').value,d=$('#bd').value,n=$('#bn').value.trim(),m=$('#bm'),a=parseFloat($('#bp').value);
 let f='',h=0,u=t==='n'?24:Math.max(1,parseInt($('#bu').value)||1);
 if(t==='f'){f=$('#bf').value;h=+$('#bh').value;if(h+u>24){say(m,false,'المدة تتجاوز منتصف الليل.');return}}
 if(t==='n')f=FLD[0];
 if(!n||!d){say(m,false,'اكتب الاسم واختر التاريخ.');return}
 if(d<today){say(m,false,'لا يمكن الحجز في تاريخ سابق.');return}
 if(isNaN(a)||a<=0){say(m,false,'اكتب السعر.');return}
 if(f&&S.bookings.some(b=>b.f===f&&b.d===d&&h<b.h+b.u&&b.h<h+u)){say(m,false,'الملعب محجوز في هذا الوقت.');return}
 const eq=t==='t'&&$('#be').checked;
 guard(m,async()=>{await put('bookings',uid(),{t,f,d,h,u,n,eq,a,...(t[0]==='a'?{end:add(d,30)}:{})});await pay(TY[t].n+(f?' - '+f:''),n,a);$('#bn').value='';say(m,true,'تم الحجز وتحصيل '+a+' ج.')})};
$('#bl').onclick=e=>{const d=e.target.dataset;if(d.x)guard($('#bm'),()=>del('bookings',d.x));
 const b=d.k&&S.bookings.find(x=>x.id===d.k);if(b)guard($('#bm'),async()=>{await put('bookings',b.id,{t:b.t,f:'',d:b.d,h:0,u:0,n:b.n,eq:false,a:b.a,end:add(b.end>today?b.end:today,30)});await pay('تجديد '+TY[b.t].n,b.n,b.a)})};
$('#pl').onclick=e=>{const id=e.target.dataset.rc;if(id)receipt(id)};

 if(FB.apiKey==="PASTE"){
  try{const x=localStorage.getItem('tg2');if(x)S=JSON.parse(x)}catch(e){}
  $('#sync').textContent='وضع تجريبي محلي: لم يتم ربط Firebase بعد.';render();return}
 firebase.initializeApp(FB);const auth=firebase.auth(),fs=firebase.firestore();let un=[];

 $('#out').onclick=()=>auth.signOut();
 auth.onAuthStateChanged(u=>{un.forEach(f=>f());un=[];
  $('#login').style.display=u?'none':'block';$('#out').style.display=u?'':'none';
  if(!u){db=null;S={members:[],bookings:[],pays:[]};render();return}
  ME=u.email;db=fs;['members','bookings','pays'].forEach(c=>un.push(fs.collection(c).onSnapshot(sn=>{S[c]=sn.docs.map(d=>({id:d.id,...d.data()}));render()},()=>say($('#lm'),false,'لا توجد صلاحية للوصول إلى البيانات.'))));
  $('#sync').textContent='متصل: '+u.email;render()});
})();
